[project]
name = "phishermanai"
version = "0.1.0"
description = "PhishermanAI - financial communication verifier for Indian retail investors (SEBI PS1)"
requires-python = ">=3.11"

# Core dependencies. Everything in the EMAIL path must be installable from this
# list alone -- the image/OCR path adds heavy optional extras, see below. This
# list is what the deployed API image installs; see requirements.txt for the
# pinned resolution of exactly this set.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.10",
    "dnspython>=2.7",
    "tldextract>=5.1",
    "authres>=1.2",
    "requests>=2.32",
    "python-dateutil>=2.9",
    "Pillow>=11.0",
    # /verify accepts PDF uploads, so the PDF text extractor is core, not extra.
    "pypdf>=5.1",
]

[project.optional-dependencies]
# Image / screenshot path (WhatsApp phase). Heavy: paddle/torch pull ~200MB+.
image = [
    "opencv-python-headless>=4.10",
    "imagehash>=4.3",
    "numpy>=1.26",
    "pyzbar>=0.1.9",
]
ocr = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
]
semantic = [
    "sentence-transformers>=3.3",
]
# SMTP gateway (gateway/run.py). The API's /gateway/messages endpoints only read
# the shared verifications table, so the API itself does NOT need these.
gateway = [
    "aiosmtpd>=1.4",
    "PyYAML>=6.0",
]
# Corpus refresh only (data/scrapers/*). Not installed in the serving image --
# data/cache/*.json is committed, and data.load_all reads it offline.
scrape = [
    "xlrd>=2.0",
    "urllib3>=2.2",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `packages = [...]` would have shipped only the top level and silently dropped
# core.chokepoints / core.filings / core.ingest / core.rules, so discover them.
[tool.setuptools.packages.find]
include = ["api*", "core*", "data*", "eval*", "gateway*"]
exclude = ["tests*", "web*", "extension*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
