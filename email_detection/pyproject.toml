[project]
name = "phishermanai"
version = "0.1.0"
description = "PhishermanAI - financial communication verifier for Indian retail investors (SEBI PS1)"
requires-python = ">=3.11"

# Core dependencies. Everything in the EMAIL path must be installable from this
# list alone -- the image/OCR path adds heavy optional extras, see below.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.10",
    "dnspython>=2.7",
    "tldextract>=5.1",
    "python-whois>=0.9.5",
    "authres>=1.2",
    "requests>=2.32",
    "python-dateutil>=2.9",
    "Pillow>=11.0",
]

[project.optional-dependencies]
# Image / screenshot path (WhatsApp phase). Heavy: paddle/torch pull ~200MB+.
image = [
    "opencv-python-headless>=4.10",
    "imagehash>=4.3",
    "numpy>=1.26",
    "pyzbar>=0.1.9",
]
ocr = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
]
semantic = [
    "sentence-transformers>=3.3",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "core", "data", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
